# =============================================================================
# Mosquitto MQTT Broker Configuration
# =============================================================================
# Minimal config for development / demo. In production you would add:
#   - TLS (listener 8883, cafile, certfile, keyfile)
#   - Authentication (password_file or auth_plugin)
#   - ACLs (acl_file)
# =============================================================================

# Listen on all interfaces, port 1883 (unencrypted)
listener 1883 0.0.0.0

# Allow connections without username/password (dev only)
allow_anonymous true

# Persistence — retain messages and subscriptions across restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
